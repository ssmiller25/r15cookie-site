{{ define "main" }}

<article>
  <header>
    <h1>{{ .Title }}</h1>
  </header>
  {{ partial "content.html" . }}
</article>
<h2>Project Log</h2>
<ul>
  {{ range .Pages.ByPublishDate.Reverse }}
  <li>
    <a href="{{ .RelPermalink }}">
      {{ .Title }} | {{ .Date.Format "2006-01-02" }}
    </a>
  </li>
  {{ end }}
</ul>

{{ end }}
